fields:
  - name: message_ts
    type: string
    required: false

  - name: chat_sender
    type: string
    required: false

  - name: vessel
    type: string
    required: false

  - name: product
    type: enum
    required: true
    synonyms_from: "entities/products.yml"
    allowed: ["HSFO380", "LSMGO", "VLSFO"]

  - name: qty_mt
    type: number
    required: false
    normalize: ["to_float"]

  - name: qty_min_mt
    type: number
    required: false
    normalize: ["to_float"]

  - name: qty_max_mt
    type: number
    required: false
    normalize: ["to_float"]

  - name: price_usd_mt
    type: number
    required: false
    normalize: ["to_float"]

  - name: premium_usd_mt
    type: number
    required: false
    normalize: ["to_float"]

  - name: barging_fee_usd
    type: number
    required: false
    normalize: ["to_float"]

  - name: currency
    type: enum
    required: false
    allowed: ["USD", "SGD", "EUR", "CNY"]
    default: "USD"

  - name: buyer
    type: string
    required: false
    synonyms_from: "entities/counterparties.yml"

  - name: supplier
    type: string
    required: false
    synonyms_from: "entities/counterparties.yml"

  - name: broker
    type: string
    required: false
    synonyms_from: "entities/counterparties.yml"

  - name: agent
    type: string
    required: false
    synonyms_from: "entities/counterparties.yml"

  - name: pricing_basis
    type: string
    required: false

  - name: port
    type: string
    required: false
    synonyms_from: "entities/ports.yml"

  - name: eta_start
    type: date
    required: false
    normalize: ["to_iso_date", "tz=Asia/Singapore"]

  - name: eta_end
    type: date
    required: false
    normalize: ["to_iso_date", "tz=Asia/Singapore"]

  - name: laycan_start
    type: date
    required: false
    normalize: ["to_iso_date", "tz=Asia/Singapore"]

  - name: laycan_end
    type: date
    required: false
    normalize: ["to_iso_date", "tz=Asia/Singapore"]

  - name: status
    type: enum
    required: false
    allowed: ["OFFER", "DONE", "SOLD", "ENQUIRY", "PRENOM", "UNKNOWN"]
    default: "UNKNOWN"

  - name: remarks
    type: string
    required: false

  - name: source
    type: enum
    required: false
    allowed: ["email", "whatsapp", "manual", "csv"]
    default: "whatsapp"
